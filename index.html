<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="exodus">

    <title>exodus</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="splash" class="splash"><div class="splash-inner"><div class="splash-logo">EX</div><div class="splash-title">exodus</div><div class="splash-sub">clean • mobile-first • private</div><div class="loader" aria-hidden="true"><span></span><span></span><span></span></div></div></div>

    <div id="app" class="app-root" style="display:none">
      <div class="screen">
        <div class="top-area">
          <div class="top-left small">I have 0 Bitcoin</div>
          <div class="top-right small">0 BTC</div>
        </div>

        <div class="swap-panel card">
          <div class="row from-row">
            <div class="token-pill">
              <div class="token-icon">₿</div>
              <div class="token-info">
                <div class="token-symbol">BTC <span class="caret">▾</span></div>
              </div>
            </div>
            <div class="amount">
              <div class="currency">$</div>
              <div class="big-amount">0.00</div>
            </div>
          </div>

          <div class="divider">
            <button class="swap-center" id="swap-center">⇅</button>
            <div class="divider-bar"></div>
          </div>

          <div class="row to-row">
            <div class="token-pill">
              <div class="token-icon eth">Ξ</div>
              <div class="token-info">
                <div class="token-symbol">ETH <span class="caret">▾</span></div>
              </div>
            </div>
            <div class="amount">
              <div class="currency">$</div>
              <div class="big-amount">0.00</div>
            </div>
          </div>

          <div class="minmax">
            <button class="pill">Min</button>
            <button class="pill">Max</button>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="notice">Swap services are available through third‑party providers.</div>

        <div class="bottom-swap card">
          <div class="bottom-pill">
            <div class="left-coin">$</div>
            <div class="arrow-set"><div class="arrow arrow-up"></div><div class="arrow arrow-down"></div></div>
            <div class="right-coin">◻</div>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
      if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
    </script>
  </body>
</html>
