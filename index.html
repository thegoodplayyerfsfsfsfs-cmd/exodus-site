<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="exodus">

    <title>exodus</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="splash" class="splash">
      <div class="splash-inner">
        <div class="splash-logo">EX</div>
        <div class="splash-title">exodus</div>
        <div class="splash-sub">clean • mobile‑first • private</div>
        <div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div id="app" class="app-root" style="display:none">
      <div class="screen">
        <div class="nav">
          <button id="back-btn" class="icon back">←</button>
          <div class="segmented">
            <button class="seg active" data-mode="buy">Buy</button>
            <button class="seg" data-mode="sell">Sell</button>
          </div>
        </div>

        <div class="top-area">
          <div class="top-left small" id="top-balance">I have 0 Bitcoin</div>
          <div class="top-right small" id="top-amount">0 BTC</div>
        </div>

        <div class="swap-panel card" id="swap-panel">
          <div class="row from-row">
            <div class="token-pill" id="from-pill">
              <div class="token-icon" id="from-icon">₿</div>
              <div class="token-info">
                <div class="token-symbol" id="from-symbol">BTC <span class="caret">▾</span></div>
              </div>
            </div>
            <div class="amount">
              <div class="currency">$</div>
              <div class="big-amount" id="usd-amount">0</div>
            </div>
          </div>

          <div class="divider">
            <button class="swap-center" id="swap-center">⇅</button>
            <div class="divider-bar"></div>
            <div class="curve-slider" id="curve-slider">
              <div class="ticks" aria-hidden="true"></div>
              <div class="knob" id="knob" draggable="true" role="slider" aria-valuemin="50" aria-valuemax="500" aria-valuenow="50"></div>
            </div>
          </div>

          <div class="row to-row">
            <div class="token-pill" id="to-pill">
              <div class="token-icon eth" id="to-icon">Ξ</div>
              <div class="token-info">
                <div class="token-symbol" id="to-symbol">ETH <span class="caret">▾</span></div>
              </div>
            </div>
            <div class="amount">
              <div class="currency">$</div>
              <div class="big-amount" id="receive-amount">0</div>
            </div>
          </div>

          <div class="minmax">
            <button class="pill" id="min-btn">Min</button>
            <button class="pill" id="max-btn">Max</button>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="notice" id="notice">Swap services are available through third‑party providers.</div>

        <div class="bottom-swap card">
          <div class="bottom-pill" id="bottom-pill">
            <div class="left-coin" id="left-coin">$</div>
            <div class="arrow-set"><div class="arrow arrow-up"></div><div class="arrow arrow-down"></div></div>
            <div class="right-coin" id="right-coin">◻</div>
          </div>
        </div>
      </div>

      <!-- token picker modal -->
      <div id="token-modal" class="modal" aria-hidden="true">
        <div class="modal-inner card">
          <input id="token-search" placeholder="Search tokens" class="search" />
          <div id="token-list" class="token-list"></div>
          <button id="close-modal" class="pill" style="margin-top:12px">Close</button>
        </div>
      </div>

    </div>

    <script src="/js/app.js"></script>
    <script>
      if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
    </script>
  </body>
</html>
