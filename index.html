<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="exodus">

    <title>exodus</title>

    <!-- PWA manifest (uses branding/logo.png if you replace it) -->
    <link rel="manifest" href="/manifest.json">

    <!-- Favicon and touch icons -->
    <link rel="icon" href="/branding/logo.png" sizes="192x192">
    <link rel="shortcut icon" href="/branding/icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/branding/apple-touch-icon.svg">

    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="splash" class="splash">
      <div class="splash-inner">
        <div class="splash-logo">EX</div>
        <div class="splash-title">exodus</div>
        <div class="splash-sub">clean • mobile‑first • private</div>
        <div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div id="app" class="app-root" style="display:none">
      <div class="screen">
        <div class="nav">
          <button id="back-btn" class="icon back" aria-label="History">←</button>
          <div class="segmented" role="tablist">
            <button class="seg active" data-mode="buy" role="tab">Buy</button>
            <button class="seg" data-mode="sell" role="tab">Sell</button>
          </div>
        </div>

        <div class="top-area">
          <div class="top-left small" id="top-balance">I have 0 Bitcoin</div>
          <div class="top-right small" id="top-amount">0 BTC</div>
        </div>

        <div class="swap-panel card" id="swap-panel">
          <div class="row from-row">
            <div class="token-pill" id="from-pill" role="button" tabindex="0">
              <div class="token-icon" id="from-icon">₿</div>
              <div class="token-info">
                <div class="token-symbol" id="from-symbol">BTC <span class="caret">▾</span></div>
              </div>
            </div>
            <div class="amount">
              <div class="currency">$</div>
              <div class="big-amount" id="usd-amount">0</div>
            </div>
          </div>

          <div class="divider">
            <button class="swap-center" id="swap-center" aria-label="Swap">⇅</button>
            <div class="divider-bar" aria-hidden="true"></div>
            <div class="curve-slider" id="curve-slider" aria-hidden="false">
              <!-- SVG curve is rendered via CSS background; ticks are decorative -->
              <div class="ticks" aria-hidden="true"></div>
              <div class="knob" id="knob" draggable="true" role="slider" aria-valuemin="50" aria-valuemax="500" aria-valuenow="50" tabindex="0"></div>
              <div class="tick-label left-label">$50</div>
              <div class="tick-label right-label">$500</div>
            </div>
          </div>

          <div class="row to-row">
            <div class="token-pill" id="to-pill" role="button" tabindex="0">
              <div class="token-icon eth" id="to-icon">Ξ</div>
              <div class="token-info">
                <div class="token-symbol" id="to-symbol">ETH <span class="caret">▾</span></div>
              </div>
            </div>
            <div class="amount">
              <div class="currency">$</div>
              <div class="big-amount" id="receive-amount">0</div>
            </div>
          </div>

          <div class="minmax">
            <button class="pill" id="min-btn">Min</button>
            <button class="pill" id="max-btn">Max</button>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="notice" id="notice">Swap services are available through third‑party providers.</div>

        <div class="bottom-swap card">
          <div class="bottom-pill" id="bottom-pill" role="button" tabindex="0">
            <div class="left-coin" id="left-coin">$</div>
            <div class="arrow-set"><div class="arrow arrow-up"></div><div class="arrow arrow-down"></div></div>
            <div class="right-coin" id="right-coin">◻</div>
          </div>
        </div>
      </div>

      <!-- token picker modal -->
      <div id="token-modal" class="modal" aria-hidden="true">
        <div class="modal-inner card" role="dialog" aria-modal="true" aria-label="Select token">
          <input id="token-search" placeholder="Search tokens" class="search" aria-label="Search tokens" />
          <div id="token-list" class="token-list" role="list"></div>
          <button id="close-modal" class="pill" style="margin-top:12px">Close</button>
        </div>
      </div>

      <!-- confirm modal -->
      <div id="confirm-modal" class="modal" aria-hidden="true">
        <div class="modal-inner card" role="dialog" aria-modal="true" aria-label="Confirm swap">
          <h3 id="confirm-title">Confirm swap</h3>
          <div id="confirm-body" style="margin-top:8px"></div>
          <div style="display:flex;gap:10px;margin-top:12px">
            <button id="confirm-cancel" class="pill" style="flex:1">Cancel</button>
            <button id="confirm-ok" class="btn" style="flex:1">Confirm</button>
          </div>
        </div>
      </div>

      <!-- history modal -->
      <div id="history-modal" class="modal" aria-hidden="true">
        <div class="modal-inner card" role="dialog" aria-modal="true" aria-label="Transaction history">
          <h3>Transaction history</h3>
          <div id="history-list" class="token-list" style="margin-top:8px"></div>
          <button id="close-history" class="pill" style="margin-top:12px">Close</button>
        </div>
      </div>

    </div>

    <script src="/js/app.js"></script>
    <script>
      if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
    </script>
  </body>
</html>
